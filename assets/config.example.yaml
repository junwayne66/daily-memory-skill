agent:
  platform: auto
  timezone: Asia/Shanghai
  canonical_memory_root: ./daily-memory
  owner:
    name: ""
    feishu_open_id: ""
    private_chat_id: ""

run:
  schedule: "0 22 * * *"
  window:
    start: "local-day-start"
    end: "run-time"
  idempotency:
    enabled: true
    run_manifest_root: ./runs
    skip_completed_same_config: true
    resume_partial_runs: true
    force: false
  concurrency:
    max_parallel_collectors: 6
    max_parallel_processors: 3
    collector_timeout_seconds: 240
  stability:
    require_lark_auth_verifier: true
    require_channel_identity_resolver: true
    require_memory_search_verification: true
    max_partition_retries: 3
    fallback_chunking:
      calendar: quarterly
      messages: by_chat
      docs: by_token
      minutes: by_time_window

memory:
  openclaw_workspace: ~/.openclaw/workspace-daily-memory
  shared_readers:
    - agent_id: main
      mode: memorySearch.extraPaths
      path: /home/botinkit/.openclaw/workspace-daily-memory/memory
  hermes_home: ~/.hermes
  codex_memory_root: ~/.codex/memories
  promote_to_native_long_term: confirmation_required
  keep_raw_evidence_days: 30
  confidence_threshold_for_event_graph: 0.72
  confidence_threshold_for_native_memory: 0.9
  write_root_bridge_note: true
  verify_reader_search_after_write: true
  reader_search_failure_policy: record_defect_and_continue_delivery

lark:
  cli: lark-cli
  domain: open.feishu.cn
  auth_mode: user_preferred_bot_fallback
  auth_policy:
    verify_strict_mode_before_collection: true
    never_login_when_user_token_ready: true
    proof_commands_required: true
  output_json: true
  dry_run_third_party_writes: true
  sources:
    private_chats:
      enabled: true
      include_user_visible_chats: true
      include_chat_ids: []
      exclude_chat_ids: []
    group_chats:
      enabled: true
      include_chat_ids: []
      include_chat_name_patterns: []
      exclude_chat_ids: []
    docs:
      enabled: true
      include_shared_docs: true
      include_doc_tokens: []
      include_docs_linked_from_messages: true
      include_docs_linked_from_calendar: true
      chunk_large_docs_by_heading: true
    materials:
      enabled: true
      include_message_attachments: true
      include_doc_attachments: true
      max_binary_download_mb: 0
      prefer_text_preview: true
    calendar:
      enabled: true
      include_attended_events: true
    meetings:
      enabled: true
      include_meeting_records: true
      include_minutes: true
      include_action_items: true
    base:
      enabled: false
      app_token: ""
      table_ids: []

extraction:
  strict_event_detection: true
  strict_task_detection: true
  redact_secrets: true
  preserve_source_refs: true
  low_confidence_requires_confirmation: true
  event_fields_required_for_promotion:
    - objective
    - source_refs
    - confidence

event_graph:
  root: ./memory/graph
  merge_duplicates: true
  duplicate_threshold: 0.82
  event_statuses:
    - open
    - in_progress
    - waiting
    - blocked
    - done
    - cancelled
    - stale
    - needs_confirmation
  attention_scoring:
    deadline_half_life_days: 3
    stale_open_loop_days: 3
    high_attention_threshold: 0.75

change_detection:
  triggers:
    - new_event
    - event_goal_changed
    - event_people_changed
    - event_start_changed
    - event_deadline_changed
    - event_progress_updated
    - event_result_updated
    - event_closure_changed
    - new_task
    - owner_changed
    - deadline_changed
    - priority_changed
    - status_changed
    - dependency_changed
    - blocked
    - unblocked
    - cancelled
    - completed
    - scope_expanded
    - scope_reduced
    - decision_conflict
    - needs_user_attention

report:
  enabled: true
  output_dir: ./reports
  language: zh-CN
  delivery:
    mode: file
    # mode: file | feishu_doc | feishu_private_message | both
    owner_private_chat_id: ""
    owner_openclaw_peer_id: ""
    feishu_doc_parent_token: ""
    title_template: "Daily Memory Report - {{date}}"
    send_private_summary_with_doc_link: true
  sections:
    - attention_items
    - event_graph_delta
    - new_events
    - updated_events
    - closed_events
    - risks_blockers
    - decisions
    - tomorrow_suggestions
    - source_gaps

notifications:
  third_party_enabled: false
  require_user_confirmation: true
  default_sender: bot
  preview_with_dry_run: true
